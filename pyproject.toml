[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "witness-public"
version = "0.1.0"
description = "Evidence-oriented MCP service with cryptographic agent identity and append-only audit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Maximiliano Coloma-Seegers"}]
requires-python = ">=3.11"
dependencies = ["fastmcp", "cryptography>=45"]

[project.urls]
Repository = "https://github.com/MaximilianoColoma/witness"
Issues = "https://github.com/MaximilianoColoma/witness/issues"
Security = "https://github.com/MaximilianoColoma/witness/security/policy"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
witness_public = ["request-schemas.json"]
