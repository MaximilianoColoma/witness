[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witness-public"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["fastmcp", "cryptography>=45"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
witness_public = ["request-schemas.json"]
